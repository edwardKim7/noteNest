name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependency (cryptography, needed to import memo.py/vault.py)
        run: python -m pip install cryptography
      - name: Compile source
        run: python -m py_compile memo.py ui_template.py vault.py
      - name: Run unit tests (unittest, no extra install required)
        run: python -m unittest discover -s tests -p "test_*.py" -v
